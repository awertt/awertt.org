<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}DCI Data Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('dashboard') }}">DCI DATA LAB</a>
  <nav>
    <a href="{{ url_for('corps', corps_name='Colts') }}">Colts</a>
    <a href="{{ url_for('head_to_head') }}">Head-to-head</a>
    <a href="{{ url_for('records') }}">Records</a>
    <a href="{{ url_for('query_page') }}">Query</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Unofficial analysis of official DCI score data. Seasons 2015-2019 and 2022-2026.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
